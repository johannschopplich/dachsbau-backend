title: Übersicht

options:
  preview: "{{ site.frontendUrl }}"

tabs:
  dashboard:
    label: Inhalt
    icon: draft
    columns:
      - width: 1/2
        sections:
          badgers: sections/badgers

      - width: 1/2
        sections:
          notes: sections/notes

          pages:
            type: pages
            label: Seiten
            create: default
            templates:
              - about
              - default
              - error
              - home
              - notes

          footer:
            type: fields
            fields:
              footer:
                label: Fußzeile
                type: pages

  seo:
    label: SEO
    icon: search
    columns:
      - width: 2/3
        sections:
          meta:
            type: fields
            fields:
              description:
                extends: fields/description
                help: Für Seiten ohne eigene Beschreibung.

      - width: 1/3
        sections:
          preview:
            type: fields
            fields:
              cover:
                extends: fields/cover
                help: Für Seiten ohne eigenes Vorschaubild.
